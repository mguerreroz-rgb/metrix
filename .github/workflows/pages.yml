name: Publicar METRIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Preparar y comprobar METRIX
        run: |
          python3 -m zipfile -e metrix-site.zip _site
          mkdir -p _site/descargas
          cp METRIX-Windows.exe METRIX-web-HTML-CSS-JavaScript.zip _site/descargas/
          node _site/jugar/verify.mjs
          test -f _site/index.html
          test -f _site/guia-docente.html
          test -f _site/documentos/METRIX-Instrucciones-paso-a-paso.pdf
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
